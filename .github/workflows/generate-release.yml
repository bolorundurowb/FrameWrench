name: Generate Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NO_LOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_PROJECT: src/FrameWrench/FrameWrench.csproj

jobs:
  generate-release:
    name: Generate Release
    # Manual runs must target master; pushes are already limited to master via on.push.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PROJ="${{ env.PACKAGE_PROJECT }}"
          if [ ! -f "$PROJ" ]; then
            echo "::error::Project file not found: $PROJ"
            exit 1
          fi

          RAW="$(dotnet msbuild "$PROJ" -getProperty:Version -nologo)"
          VER="$(echo "$RAW" | tail -n1 | tr -d '\r' | xargs)"

          if [ -z "$VER" ]; then
            echo "::error::Could not read <Version> (empty after MSBuild evaluation). Check $PROJ or Directory.Build.props."
            exit 1
          fi

          # NuGet-compatible / SemVer 2.0 style (no spaces, reasonable characters)
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.+]+)?(\+[0-9A-Za-z.+]+)?$ ]]; then
            echo "::error::Malformed Version '$VER'. Expected forms like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved Version=$VER (tag will be v${VER})"

      - name: Fetch tags and check for existing release tag
        id: tag_check
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on this clone — skipping build and release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG not found — will build, pack, and publish."
          fi

      - name: Skip release (tag already exists)
        if: steps.tag_check.outputs.exists == 'true'
        shell: bash
        run: |
          echo "No release created: ${{ steps.tag_check.outputs.tag }} already exists."

      - name: Restore dependencies
        if: steps.tag_check.outputs.exists != 'true'
        run: dotnet restore "${{ env.PACKAGE_PROJECT }}"

      - name: Build (Release)
        if: steps.tag_check.outputs.exists != 'true'
        run: dotnet build "${{ env.PACKAGE_PROJECT }}" --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pack NuGet
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet pack "${{ env.PACKAGE_PROJECT }}" \
            --configuration Release \
            --no-build \
            --output artifacts

      - name: Verify package artifact
        if: steps.tag_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(artifacts/*.nupkg)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::No .nupkg produced under artifacts/"
            exit 1
          fi
          ls -la artifacts/

      - name: Determine prerelease flag
        if: steps.tag_check.outputs.exists != 'true'
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          if [[ "$VER" == *"-alpha"* ]] || [[ "$VER" == *"-beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (tag + notes + assets)
        if: steps.tag_check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.flags.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(artifacts/*.nupkg)

          PR_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            PR_ARGS+=(--prerelease)
          fi

          # Prefer GitHub auto-generated release notes; fall back to recent commit subjects.
          if gh release create "$TAG" "${pkgs[@]}" \
              --title "FrameWrench ${VERSION}" \
              --target "${{ github.sha }}" \
              --generate-notes \
              "${PR_ARGS[@]}"; then
            echo "Release $TAG created with auto-generated notes."
            exit 0
          fi

          echo "::warning::gh release create --generate-notes failed; falling back to commit-log notes."
          NOTES_FILE="$(mktemp)"
          {
            echo "## Changes"
            echo ""
            PREV="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..HEAD"
            else
              git log --no-merges -50 --pretty=format:'- %s (%h)'
            fi
          } > "$NOTES_FILE"

          gh release create "$TAG" "${pkgs[@]}" \
            --title "FrameWrench ${VERSION}" \
            --target "${{ github.sha }}" \
            --notes-file "$NOTES_FILE" \
            "${PR_ARGS[@]}"
