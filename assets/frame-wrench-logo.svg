<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
<!--Mask for the wrench cutouts (U‑shape and hexagon)-->
    <mask id="wrenchMask">
<!--Everything white is visible-->
      <rect width="200" height="200" fill="white"/>
<!--Open end cutout (U‑shaped gap)-->
      <rect x="92" y="45" width="16" height="25" fill="black"/>
      <circle cx="100" cy="70" r="8" fill="black"/>
<!--Box end cutout (hexagonal hole for .NET)-->
      <polygon points="100,120 108.66,125 108.66,135 100,140 91.34,135 91.34,125" fill="black"/>
    </mask>
  </defs>
<!--Rounded Square Frame-->
  <rect x="40" y="40" width="120" height="120" rx="16" fill="none" stroke="#68217A" stroke-width="12"/>
<!--Wrench (rotated -45°) – single filled shape, no strokes = no seams-->
  <g transform="rotate(135, 100, 100)" mask="url(#wrenchMask)">
<!--Open end circle-->
    <circle cx="100" cy="70" r="24" fill="#0078D4"/>
<!--Box end circle-->
    <circle cx="100" cy="130" r="24" fill="#0078D4"/>
<!--Handle (connects both circles)-->
    <rect x="91" y="70" width="18" height="60" fill="#0078D4"/>
  </g>
<!--Small Data Detail (frame‑level packet)-->
  <line x1="55" y1="140" x2="75" y2="140" stroke="#68217A" stroke-width="6" stroke-linecap="round"/>
</svg>
